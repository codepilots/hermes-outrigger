name: outrigger
version: 0.2.0
manifest_version: 2
description: Let a thin client attach to a Hermes session and offer tools that run on the client.
author: Autumn Thomson
license: MIT
provides_tools: [outrigger_call, outrigger_tools, notebook_read, notebook_edit]
provides_hooks: [pre_llm_call, on_session_end, subagent_start, subagent_stop]
python_dependencies: ["jsonschema>=4,<5"]
config_schema:
  enabled_routes: {type: bool, default: true, description: "Mount /v1/outrigger/ws (gateway restart needed)"}
  allow_remote: {type: bool, default: false, description: "Accept remote clients (paired tokens). Requests through a reverse proxy or tunnel (cloudflared) count as remote. See docs/remote-access.md"}
  owner_key_remote: {type: bool, default: false, description: "Also accept the API key from remote clients. Off: the key works only on this machine; use admin tokens remotely"}
  user_toolsets: {type: list, default: [web, outrigger, no_mcp], description: "Hermes toolsets for paired non-admin users' chats (the owner and admin tokens keep the platform default). no_mcp keeps MCP servers out; an empty list means no tools"}
  max_clients_per_token: {type: int, default: 4, description: "Connections one paired token may hold at once"}
  user_messages_per_min: {type: int, default: 20, description: "Chat messages and // commands per minute for a paired non-admin user"}
  max_chat_chars: {type: int, default: 100000, description: "Longest chat message accepted"}
  auth_token: {type: secret, default: "", description: "Bearer token for clients; falls back to the gateway's resolved API key (platform config/secret, then API_SERVER_KEY env). See docs/security-review/auth-trust-boundary.md"}
  allow_keyless_local: {type: bool, default: true, description: "Allow a credential-less loopback client to attach as owner (local dev). Set false on a shared host to refuse every keyless owner attach. A header-less relay can still look local — see docs/security-review/auth-trust-boundary.md"}
  default_timeout_s: {type: int, default: 60, description: "Per-call timeout when the tool declares none"}
  max_timeout_s: {type: int, default: 400, description: "Cap on tool-declared timeouts (Hermes abandons calls at 420s)"}
  max_result_chars: {type: int, default: 20000, description: "Result size cap"}
  max_calls_per_turn: {type: int, default: 20, description: "Per client, per turn"}
  context_max_chars: {type: int, default: 6000, description: "Cap on the per-turn attached-clients context"}
  audit_args: {type: bool, default: false, description: "Write argument bodies to the audit log"}
  allow_subagents: {type: bool, default: false, description: "Let delegated subagents call attached clients"}
  review: {type: str, default: "smart", description: "smart: an LLM reviews calls that need approval (verdicts are advisory: a deny is shown to the user as a flagged prompt unless review_deny=block; approve lets the client skip asking). off: no review"}
  review_timeout_s: {type: int, default: 30, description: "Reviewer call timeout"}
  notebook_roots: {type: dict, default: {}, description: "Notebook mode: name -> folder whose .md notes the owner's clients may open and edit, e.g. {notes: ~/vaults/notes}"}
  notebook_roots_for: {type: dict, default: {}, description: "Roots paired token users may open, by user id, e.g. {ann: [shared]} or {ann: '*'}. The owner always gets every root"}
  notebook_max_bytes: {type: int, default: 2097152, description: "Largest note Notebook mode opens or writes"}
  notebook_lock_timeout_s: {type: int, default: 600, description: "A // command's lock is released after this long"}
  platform: {type: bool, default: true, description: "Register the Outrigger messaging platform: clients' chats go through Hermes's messaging pipeline (slash commands, /model). Gateway restart needed"}
  platform_owner_id: {type: str, default: "owner", description: "User id for chats from clients authenticated with the API key"}
  platform_owner_name: {type: str, default: "", description: "Display name for that user"}
  user_allowed_commands: {type: list, default: [status, new, stop, retry, undo, title, usage, queue, q, btw, save, context, commands, sessions, resume], description: "Slash commands paired non-admin users may run (Hermes always allows /help and /whoami)"}
  review_deny: {type: str, default: "ask", description: "ask: a reviewer deny is shown to the user as a flagged prompt they can override; block: a deny is final"}
  review_policy: {type: str, default: "", description: "Extra rules appended to the reviewer's instructions"}
